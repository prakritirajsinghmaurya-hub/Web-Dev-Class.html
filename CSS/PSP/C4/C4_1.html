<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grandparent{
            height: 150px;
            width: 600px;
            display: flex;
            justify-content: space-evenly;
        }
        #parent1{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            height: 100%;
            width: 40%;
        }
        #parent2{
            display: inline-block;
            width: 40%;
            height: 100%;
        }
        #child1{
            background-color: red;
            width: 100%;
            height: 15%;
        }
        #child2{
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            height: 85%;
        }
        #papagreen{
            width: 50%;
            height: 90%;
            display: flex;
            flex-direction: column;
            justify-content: end;
            align-items: center;
            justify-content: center;
            justify-content: space-evenly;
        }
        #badablue{
            width: 50%;
            height: 85%;
            background-color: aqua;
            display: inline-block;
            position: relative;
            top: 4px;
        }
        #green{
            background-color: lightgreen;
            height: 75%;
            width: 95%;
            display: flex;
            align-self: start;
        }
        #pink{
            background-color: lightpink;
            height: 15%;
            width: 95%;
            display: flex;
            align-self: start;
        }

        #p2c1{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            height: 75%;
            width: 100%;
        }
        .a{
            height: 20%;
            width: 45%;
        }
        #p2c2{
            background-color: red;
            width: 95%;
            height: 15%;
            position: relative;
            left: 6px;
        }

    </style>
</head>
<body>
    <div id="grandparent">

        <div id="parent1">
            <div id="child1"></div>
            <div id="child2">
                <div id="papagreen">
                    <div id="green"></div>
                    <div id="pink"></div>
                </div>
                <div id="badablue"></div>
            </div>
            
        </div>

        <div id="parent2">
            <div id="p2c1">
                <div class="a" ></div>
                <div class="a"></div>
                <div class="a"></div>
                <div class="a"></div>
                <div class="a"></div>
                <div class="a"></div>
            </div>
            <div id="p2c2"></div>
        </div>

    </div>
</body>
</html>
