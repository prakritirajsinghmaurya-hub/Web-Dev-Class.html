<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0; padding: 0;
            background-color: black;
        }
        #gnd{
            height: 100vh; width: 100vw;
        }
        #nav1{
            width: 100vw; height: 100px;
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation-duration: 3s;
            animation-name: prsm;
        }
        .one{
            height: 50px;
            width: 80px;
            background-color: gold;
        }
        @keyframes prsm{
            0%{
                transform: translateX(0%);
            }
            50%{
                transform: translateX(50%);
            }
            100%{
                transform: translateX(100%);
            }
        }
    </style>
</head>
<body>
    <div id="gnd">
        <nav id="nav1">
            <div class="one"></div>
            <div class="one"></div>
            <div class="one"></div>
            <div class="one"></div>
            <div class="one"></div>
            <div class="one"></div>
            <div class="one"></div>
        </nav>
    </div>
</body>
</html>
