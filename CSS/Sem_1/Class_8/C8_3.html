<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #one{
            height: 500px;
            width: 300px;
            background-color: indigo;
            transition-duration: 5s;
            align-self: center;

        }
        #one:hover{
            transform: rotate(5555555555deg);
        }
        #two{
            height: 30%;
            width: 100%;
            background-color: dodgerblue;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="one">
        <div id="two">
        
        </div>
    </div>
</body>
</html>
