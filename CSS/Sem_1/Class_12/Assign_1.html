    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
        }
        #moments{
            height: 200px;
            width: 90vw;
            background-color: black;
            color: white;
            margin: 0% auto;
        }
        #long{
            width: 90vw;
            height: 400px;
            margin: 0% auto;
        }
        #long:hover h3{
            opacity: 1;
            transform: translateY(-30px);
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 20px;
        }
        #main{
            height: 100vh;
            width: 90vw;
            margin: 0% auto;
            background-color: black;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
        }
        .a{
            border-radius: 20%;
        }
        h3{
            opacity: 0;
            transition: 3s;
            color: white;
            font-size: xx-large;
            position: relative;
            bottom: 40px;
            height:fit-content;
            width: fit-content;
        }
        .a:hover h3{
            opacity: 1;
            transform: translateY(-60px);
        }
        img:hover{
            transition: 3s;
            transform:scale(1.02);
        }
        #one{
            grid-column: span 2;
        }
    </style>
</head>
