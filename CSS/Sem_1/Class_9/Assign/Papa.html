<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 1000px;
            width: 1000px;
            /* border: 2px solid; */
        }
        #pic{
            height: 450px; 
            width: 800px;
            transform: rotateY(90deg);
            font-family: 'georgia' , serif;
            font-style: italic;
            font-size:xx-large;
            text-align: center;
            background-color: #1e2e24;
            color: #e6dfd3;
        }
        img{
        height: 500px;
        width: 850px;
        position: absolute;
        }
        #main:hover #img {
            transform: rotateY(90deg);
            transition-duration: 3s;
        }
        #main:hover #pic{
            transform: rotateY(0deg);
            transition-delay: 3s;
            transition-duration: 3s;
        }

    </style>
</head>
<body>
    <div id="main">
        <img id="img" src="./Papa.jpeg" >

        <div id="pic" >
        <h2> Dad </h2>
        <p>I may not be the boy you wanted, but I am the son you need.</p>
        </div>
    </div>
</body>
</html>
