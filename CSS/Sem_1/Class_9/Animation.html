<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color:rgb(92, 72, 225);
        }
        div:hover{
            animation-name: prsm;
            animation-duration: 3s;
        }
        @keyframes prsm{
            0%{
                border-radius: 20%;
                background-color: aqua;
            }
            100%{
                border-radius: 50%;
                background-color: blue;
            
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
