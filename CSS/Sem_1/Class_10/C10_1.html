<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
        #left{
            height:100px;
            width:100px;
            border-radius: 50%;
            background: linear-gradient(rgb(218, 199, 30), red);
            animation-name: left;
            animation-duration: 900ms;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        #center{
            height:100px;
            width:100px;
            border-radius: 50%;
            background-color: blue;
            animation-name: center;
            animation-duration: 900ms;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-delay: 300ms;
        }
        #right{
            height:100px;
            width:100px;
            border-radius: 50%;
            background-color: fuchsia;
            animation-name: right;
            animation-duration: 900ms;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-delay: 600ms;
        }
        #main{
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            background-color: black;
            justify-content: center;
            align-items: center;
        }
        @keyframes left{
            0%{
                transform: scale(1);
            }
            100%{
                transform: scale(0.5);
            }
        }
                @keyframes center{
            0%{
                transform: scale(1);
            }
            100%{
                transform: scale(0.5);
            }
        }
                @keyframes right{
            0%{
                transform: scale(1);
            }
            100%{
                transform: scale(0.5);
            }
        }

    </style>
</head>
<body>
    <div id="main">
        <div id="left"></div>
        <div id="center"></div>
        <div id="right"></div>
    </div>
</body>
</html>
