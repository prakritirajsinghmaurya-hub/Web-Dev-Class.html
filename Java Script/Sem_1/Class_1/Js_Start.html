<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // ======================================
// 1. First JavaScript Program
// ======================================

console.log("Hello JavaScript!");


// ======================================
// 2. Variables
// ======================================

let name = "Rupesh";
let age = 27;

console.log(name);
console.log(age);


// ======================================
// 3. const
// ======================================

const country = "India";

console.log(country);


// ======================================
// 4. Data Types
// ======================================

let studentName = "Rahul";   // String
let marks = 85;              // Number
let isPassed = true;         // Boolean
let value = null;            // Null
let result;                  // Undefined

console.log(typeof studentName);
console.log(typeof marks);
console.log(typeof isPassed);
console.log(typeof value);
console.log(typeof result);


// ======================================
// 5. Basic Operations
// ======================================

let a = 20;
let b = 10;

console.log(a + b);  // Addition
console.log(a - b);  // Subtraction
console.log(a * b);  // Multiplication
console.log(a / b);  // Division
console.log(a % b);  // Remainder


// ======================================
// 6. String + Number
// ======================================

let firstName = "Rupesh";
let userAge = 27;

console.log("My name is " + firstName);
console.log("My age is " + userAge);


// ======================================
// 7. Template Literals
// ======================================

console.log(`My name is ${firstName} and I am ${userAge} years old.`);


// ======================================
// 8. Comparison
// ======================================

let x = 10;
let y = 20;

console.log(x > y);
console.log(x < y);
console.log(x == y);
console.log(x != y);
console.log(x === y);


// ======================================
// 9. Output on Web Page
// ======================================

document.getElementById("output").innerText =
    `Hello ${firstName}! Welcome to JavaScript.`;
    </script>
</body>
</html>
