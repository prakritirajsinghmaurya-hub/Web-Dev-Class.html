<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
        #main{
            width: 100%;    
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: aqua;
        }
        #todo-box{
            width: 600px;
            height: 600px;
            background-color: aqua;
            border-radius: 100px;
            box-shadow: 0px 7px 11px black;
        }
        #text{
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
        #add{
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box{
            width: 300px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border: none;
            border-radius: 10px;
        }
        #add-button{
            width: 100px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blue;
            color: white;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
        }
        #todo-list{
            width: 100%;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            
        }
        li{
            width: 70%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            margin-top: 10px;
            border-radius: 10px;
        }
        button{
            width: 100px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: red;
            color: white;
            margin-right: 10px;
            border: none;
            border-radius: 10px;
        }
        #todo-text{
            width: 70%;
            height: 100%;
            display: flex;
            margin-left: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="todo-box">
        <div id="text">My-todo-list</div>
        <div id="add">
            
                <input id="box" type="text" id="todo-input" placeholder="Enter a task">
            
            <button id="add-button">Add Task</button>
        </div>
        <ul id="todo-list" type="none">
            <li><div id="todo-text">abcd</div><button>remove</button></li>
        </ul>
        </div>
    </div>

    <script>
        const addButton = document.getElementById('add-button');
        const todoList = document.getElementById('todo-list');
        const todoInput = document.getElementById('box');

        addButton.addEventListener('click', function() {
            const taskText = todoInput.value.trim();
            if (taskText !== '') {
                const li = document.createElement('li');
                const taskDiv = document.createElement('div');
                taskDiv.id = 'todo-text';
                taskDiv.textContent = taskText;

                const removeButton = document.createElement('button');
                removeButton.textContent = 'remove';
                removeButton.addEventListener('click', function() {
                    todoList.removeChild(li);
                });

                li.appendChild(taskDiv);
                li.appendChild(removeButton);
                todoList.appendChild(li);

                todoInput.value = '';
            }
        });
    </script>
</body>
</html>
