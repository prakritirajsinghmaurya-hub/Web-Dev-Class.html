<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathematics for AI – I · Study tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f8;--surface:#fff;--ink:#141a2e;--muted:#667;--line:#dfe2ec;--track:#e6e8f0;
--u1:#233a96;--u2:#6a2fa8;--u3:#2b7a58;--u4:#b3382c;--u5:#c4501e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11131b;--surface:#1a1d29;--ink:#e8eaf3;--muted:#98a0b8;--line:#2a2f42;--track:#2a2f42;--u1:#8fa4ff;--u2:#c09bf2;--u3:#6fcfa0;--u4:#ff8f82;--u5:#ffa070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11131b;--surface:#1a1d29;--ink:#e8eaf3;--muted:#98a0b8;--line:#2a2f42;--track:#2a2f42;--u1:#8fa4ff;--u2:#c09bf2;--u3:#6fcfa0;--u4:#ff8f82;--u5:#ffa070;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;padding:28px 16px 60px;display:flex;justify-content:center}
main{width:100%;max-width:680px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--u1);outline-offset:2px;border-radius:6px}
header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
#rbg{stroke:var(--track)}
#rfg{stroke:var(--u3);stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3;transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
#pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:22px}
h1{margin:0;font-size:26px;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted)}
.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.next div{flex:1;min-width:0}
.next small{color:var(--muted);display:block}
.next b{display:block;font-size:17px}
.go{background:var(--u1);color:var(--bg);font-weight:600;padding:10px 14px;border-radius:10px;transition:transform .15s}
.go:active{transform:scale(.95)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#q{flex:1;min-width:160px;padding:10px 14px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px}
.seg{display:flex;background:var(--track);border-radius:10px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;border-top:4px solid var(--c)}
.uh{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.uh .t{flex:1;min-width:0}
.uh .t span{color:var(--c);font-weight:700;font-size:13px;display:block}
.uh .t b{font-size:18px;display:block}
.cnt{color:var(--muted);font-size:14px;white-space:nowrap}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .3s;margin:0 4px 4px}
.unit.open .chev{transform:rotate(225deg) translate(-2px,-2px)}
.bar{height:5px;background:var(--track)}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .5s cubic-bezier(.3,.8,.3,1)}
.badge{display:none;color:var(--bg);background:var(--c);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.unit.full .badge{display:inline-block}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.unit.open .body{grid-template-rows:1fr}
.inner{overflow:hidden}
.unit.open .inner{padding-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background .15s}
.row:hover{background:var(--bg)}
.box{width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.box::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .2s}
.row.done .box{background:var(--c);border-color:var(--c);transform:scale(1.08)}
.row.done .box::after{transform:rotate(45deg) scale(1)}
.num{color:var(--muted);width:34px;flex:none;font-weight:600}
.nm{flex:1;min-width:0;transition:color .25s;background:linear-gradient(currentColor,currentColor) 0 55%/0 1.5px no-repeat;transition:background-size .3s,color .25s}
.row.done .nm{color:var(--muted);background-size:100% 1.5px}
.pg{color:var(--muted);font-size:13px}
.row input{position:absolute;opacity:0;pointer-events:none}
.row:has(input:focus-visible) .box{outline:2px solid var(--u1);outline-offset:2px}
.ufoot{padding:4px 16px 8px;text-align:right}
.link{color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}
.empty{text-align:center;color:var(--muted);padding:28px}
.foot{text-align:center;margin-top:18px}
.danger.sure{color:var(--u4);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<header>
  <div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle id="rbg" cx="48" cy="48" r="40"/><circle id="rfg" cx="48" cy="48" r="40"/></svg><div id="pct">0%</div></div>
  <div><h1>Mathematics for AI – I</h1><p class="sub" id="sum"></p></div>
</header>
<div class="next" id="next"></div>
<div class="tools">
  <input id="q" type="search" placeholder="Search topics" aria-label="Search topics" autocomplete="off">
  <div class="seg" id="seg"><button data-f="all" class="on">All</button><button data-f="todo">To do</button><button data-f="done">Done</button></div>
</div>
<div id="units"></div>
<div class="empty" id="none" hidden>No topics match your search.</div>
<div class="foot"><button class="link danger" id="reset">Clear all ticks</button></div>
</main>
<script>
const U=[
["Unit 1","Foundations of Arithmetic",4,"--u1","Classification of Numbers|5,Absolute Value|6,Number Systems and Base Conversion|7,Ratio and Proportion|10,Percentage|11,Factors, Multiples and Primes|13,Prime Factorisation and Number of Factors|14,GCD and LCM|15,The Euclidean Algorithm|16"],
["Unit 2","Propositional Logic",18,"--u2","Propositions|19,Logical Connectives|19,Conditional Statements|20,The Biconditional|22,Translating English into Symbols|22,Precedence of Logical Operators|23,Building Truth Tables|24,Tautology, Contradiction and Contingency|24,Logical Equivalence and De Morgan’s Laws|25"],
["Unit 3","Set Theory and Combinatorics",28,"--u3","Sets and Their Representation|29,Subsets and Power Sets|29,Operations on Sets|30,Set Laws and De Morgan’s Laws|31,Inclusion–Exclusion Principle|32,Cartesian Product|33,Principles of Counting|34,Permutations|35,Combinations|38,The Pigeonhole Principle|40,The Binomial Theorem|40"],
["Unit 4","Coordinate Geometry and Matrices",43,"--u4","Distance Formula|44,Section Formula and Midpoint|44,Slope of a Line|45,Equations of a Line|46,Parallel and Perpendicular Lines|47,Distance of a Point from a Line|48,Matrices and Their Types|49,Matrix Operations|50,Matrix Multiplication|50,Transpose and Symmetric Matrices|52,Determinants|52,Inverse of a Matrix|54,Orthogonal Matrices|55"],
["Unit 5","Vectors and Data Representation",56,"--u5","Scalars and Vectors|57,Types of Vectors|57,Vectors in Component Form|58,Vector Operations|59,Dot Product and the Angle between Vectors|60,Projection of a Vector|61,Linear Combination and Span|62,Linear Dependence and Independence|63,Eigenvalues and Eigenvectors|64,Data Tables and Frequency Tables|66,Bar Graphs|67,Line Charts|67,Histograms|68,Choosing the Right Chart|69"]];
const $=s=>document.querySelector(s);
let done={},open={0:true},filter="all",query="",key="mathai-done";
try{done=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(done))}catch(e){}};
const units=U.map((u,ui)=>({ui,label:u[0],title:u[1],page:u[2],c:u[3],
  topics:u[4].split(/,(?=[A-Z])/).map((s,i)=>{const[n,p]=s.split("|");return{id:`${ui+1}.${i+1}`,name:n,page:p}})}));
const all=units.flatMap(u=>u.topics.map(t=>({...t,u})));
const wrap=$("#units");
units.forEach(u=>{
  const el=document.createElement("section");el.className="unit";el.style.setProperty("--c",`var(${u.c})`);
  el.innerHTML=`<button class="uh" aria-expanded="false"><div class="t"><span>${u.label} · page ${u.page}</span><b>${u.title}</b></div><span class="badge">Complete</span><span class="cnt"></span><i class="chev"></i></button>
  <div class="bar"><i></i></div><div class="body"><div class="inner"><div class="rows"></div><div class="ufoot"><button class="link">Clear this unit</button></div></div></div>`;
  u.el=el;
  el.querySelector(".uh").onclick=()=>{open[u.ui]=!open[u.ui];paint()};
  el.querySelector(".ufoot button").onclick=()=>{u.topics.forEach(t=>delete done[t.id]);save();paint()};
  const rows=el.querySelector(".rows");
  u.topics.forEach(t=>{
    const r=document.createElement("label");r.className="row";
    r.innerHTML=`<input type="checkbox"><span class="box"></span><span class="num">${t.id}</span><span class="nm">${t.name}</span><span class="pg">p. ${t.page}</span>`;
    r.querySelector("input").onchange=e=>{e.target.checked?done[t.id]=1:delete done[t.id];save();paint()};
    t.row=r;rows.append(r);
  });
  wrap.append(el);
});
function paint(){
  const total=all.length,n=all.filter(t=>done[t.id]).length,p=Math.round(n/total*100),q=query.toLowerCase();
  $("#pct").textContent=p+"%";$("#rfg").style.strokeDashoffset=251.3*(1-n/total);
  $("#sum").textContent=`${n} of ${total} topics done`;
  let shown=0;
  units.forEach(u=>{
    const d=u.topics.filter(t=>done[t.id]).length;let vis=0;
    u.topics.forEach(t=>{
      const isDone=!!done[t.id];
      t.row.classList.toggle("done",isDone);t.row.querySelector("input").checked=isDone;
      const ok=(!q||(t.name+" "+t.id).toLowerCase().includes(q))&&(filter=="all"||(filter=="done")==isDone);
      t.row.hidden=!ok;if(ok)vis++;
    });
    shown+=vis;
    const full=d==u.topics.length;
    u.el.classList.toggle("full",full);
    u.el.hidden=(q||filter!="all")&&!vis;
    const isOpen=open[u.ui]||((q||filter!="all")&&vis>0);
    u.el.classList.toggle("open",!!isOpen);u.el.querySelector(".uh").setAttribute("aria-expanded",!!isOpen);
    u.el.querySelector(".cnt").textContent=`${d}/${u.topics.length}`;
    u.el.querySelector(".bar i").style.width=(d/u.topics.length*100)+"%";
  });
  $("#none").hidden=shown>0;
  const nx=all.find(t=>!done[t.id]),nb=$("#next");
  nb.innerHTML=nx?`<div><small>Up next</small><b>${nx.id} ${nx.name}</b><small>${nx.u.label} · page ${nx.page}</small></div><button class="go">Mark done</button>`:`<div><b>All topics complete 🎉</b><small>Great work. Clear all ticks to start again.</small></div>`;
  if(nx)nb.querySelector(".go").onclick=()=>{done[nx.id]=1;save();paint()};
}
$("#q").oninput=e=>{query=e.target.value.trim();paint()};
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));paint()};
let tm;$("#reset").onclick=e=>{const b=e.target;
  if(b.classList.contains("sure")){done={};save();paint();b.classList.remove("sure");b.textContent="Clear all ticks";clearTimeout(tm);return}
  b.classList.add("sure");b.textContent="Tap again to confirm";tm=setTimeout(()=>{b.classList.remove("sure");b.textContent="Clear all ticks"},3000)};
paint();
</script>
</body>
</html>
